    <meta property="og:title" content="Photography — Aidan Yu" />
    <meta property="og:description" content="35mm film photography by Aidan Yu — textures, landscapes, and the night sky from the Pacific Northwest." />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="site-title" href="index.html">aidan yu</a>
      <nav aria-label="Primary">
        <ul class="nav">
          <li><a href="index.html">home</a></li>
          <li><a href="blog.html">blog</a></li>
          <li><a href="projects.html">projects</a></li>
          <li><a href="rockets.html">rockets</a></li>
          <li><a href="photography.html" aria-current="page">photography</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1 class="page-title">photography</h1>
      <p>Captured on 35mm film, focusing on textures, landscapes, and the night sky.</p>

      <div class="photo-grid">
        <button type="button" class="photo-card">
          <img src="images/starry_night.jpg" alt="Starry night sky over mountains" width="1024" height="1024" loading="lazy" />
          <span class="photo-caption">
            <span>Starry Night</span>
            <span>Brothers, OR — 2026</span>
          </span>
        </button>

        <button type="button" class="photo-card">
          <img src="images/mountain_peak.jpg" alt="Snow-capped mountain peak" width="1024" height="1024" loading="lazy" />
          <span class="photo-caption">
            <span>Solitary Peak</span>
            <span>Mt. Hood, OR — 2025</span>
          </span>
        </button>
      </div>
    </main>

    <!-- Full View Photo Modal -->
    <div class="photo-modal" id="photoModal" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
      <button class="photo-modal-close" id="modalClose" aria-label="Close image viewer">&times;</button>
      <div class="photo-modal-content">
        <!-- Transparent overlay on top of image to block right clicks and dragging -->
        <div class="photo-modal-overlay"></div>
        <img class="photo-modal-image" id="modalImage" src="" alt="" draggable="false" />
      </div>
    </div>

    <script src="photography.js"></script>
  </body>
</html>
